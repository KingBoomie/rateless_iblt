[package]
name = "riblt"
version = "0.1.3"
edition = "2024"
authors = ["Sam Wighton"]
license = "MIT"
description = "A Rust implementation of the Rateless Invertable Bloom Lookup Table (RIBLT) data structure."
repository = "https://github.com/samWighton/rateless_iblt"
documentation = "https://docs.rs/riblt/latest/riblt/"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[features]
default = ["std"]
std = ["serde/std", "twox-hash/std"]

[dependencies]
postcard = { version = "1.0.0", features = ["use-std"] }
serde = { version = "1.0.203", default-features = false, features = ["derive"] }
serde-big-array = "0.5"
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash64"] }

[dev-dependencies]
postcard = { version = "1.0.0", features = ["use-std"] }
rand = "0.9.2"
proptest = "1.9.0"
criterion = "0.7.0"
csv = "1.4.0"
indicatif = "0.18.3"

[[bench]]
name = "benchmarks"
harness = false
