[package]
name = "riblt"
version = "0.2.0"
edition = "2024"
authors = ["Sam Wighton", "KingBoomie"]
license = "MIT"
description = "A Rust implementation of the Rateless Invertable Bloom Lookup Table (RIBLT) data structure."
repository = "https://github.com/KingBoomie/rateless_iblt"
# documentation = "https://docs.rs/riblt/latest/riblt/"

[[example]]
name = "chat_sync"
path = "examples/chat_sync.rs"

[dependencies]
bincode = "1.3.3"
rand = "0.9.2"
serde = { version = "1.0.203", features = ["derive"] }
twox-hash = "2.1.2"

[dev-dependencies]
bincode = "1.3.3"
proptest = "1.9.0"
criterion = "0.7.0"
csv = "1.4.0"
indicatif = "0.18.3"

[[bench]]
name = "benchmarks"
harness = false
